# ===================================================================
# DỊCH VỤ XÁC THỰC VÀ QUẢN LÝ NGƯỜI DÙNG (AUTH SERVICE)
# Kiến trúc Hướng dịch vụ (SOA - Service Oriented Architecture):
# - Độc lập tiến trình (Independent Process): Chạy trên cổng mạng riêng (8080).
# - Độc lập dữ liệu (Database-per-Service): Sở hữu CSDL auth_db riêng biệt.
# ===================================================================

# 1. Định danh Service trong hệ thống SOA
spring.application.name=auth-service

# 2. Cổng dịch vụ chạy riêng biệt (Port 8080)
server.port=8080

# ===================================================================
# 3. Cấu hình Cơ sở dữ liệu riêng (Database-per-Service)
# ===================================================================
# CSDL H2 File-based lưu dữ liệu người dùng tại ./data/auth_db
spring.datasource.url=jdbc:h2:file:./data/auth_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console tại: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# 4. Cấu hình JPA & Hibernate ORM
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# 5. Cấu hình Swagger UI / SpringDoc OpenAPI
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===================================================================
# 6. Cấu hình JWT Bí mật (Khóa chia sẻ chuẩn HMAC-SHA256 >= 256 bits)
# ===================================================================
jwt.secret=soa-architecture-jwt-secret-key-very-secure-2026-super-strong-token-signature
jwt.expiration=86400000
