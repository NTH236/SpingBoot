# ===================================================================
# DỊCH VỤ QUẢN LÝ SẢN PHẨM (PRODUCT MANAGEMENT SERVICE)
# Kiến trúc Hướng dịch vụ (SOA - Service Oriented Architecture):
# - Độc lập tiến trình (Independent Process): Chạy trên cổng mạng riêng (8081).
# - Độc lập dữ liệu (Database-per-Service): Sở hữu CSDL product_db riêng biệt.
# - Giao tiếp liên dịch vụ (Inter-Service Communication): Gọi sang Auth Service (Port 8080)
#   qua giao thức HTTP REST để xác thực Token của client.
# ===================================================================

# 1. Định danh Service trong hệ thống SOA
spring.application.name=product-management-service

# 2. Cổng dịch vụ chạy riêng biệt (Port 8081)
server.port=8081

# ===================================================================
# 3. Cấu hình Cơ sở dữ liệu riêng (Database-per-Service)
# ===================================================================
# CSDL H2 File-based lưu dữ liệu sản phẩm tại ./data/product_db
spring.datasource.url=jdbc:h2:file:./data/product_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console tại: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# 4. Cấu hình JPA & Hibernate ORM
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# 5. Cấu hình Swagger UI / SpringDoc OpenAPI
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===================================================================
# 6. Cấu hình Kết nối Liên dịch vụ sang Auth Service (SOA Communication)
# ===================================================================
auth.service.url=http://localhost:8080
auth.service.validate-endpoint=/auth/validate
